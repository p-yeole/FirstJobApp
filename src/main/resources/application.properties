spring.application.name=FirstJobApp

server.port=8081
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# DataSource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/FirstJobApp
spring.datasource.username=root
spring.datasource.password=MySQL2023

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#logging for swagger-UI
logging.level.org.springdoc=DEBUG

#for securityConfig
spring.main.allow-bean-definition-overriding=true

#JWT secret key and expiration time
# optional (1 hour in ms)
jwt.secret=MySuperStrongSecretKeyForJWT1234567890
jwt.expiration=3600000