spring.application.name=FirstJobApp
spring.profiles.active=aws
server.port=8081

# Disable devtools restart
spring.devtools.restart.enabled=false

# ===============================
# PostgreSQL DataSource (AWS RDS)
# ===============================
spring.datasource.url=jdbc:postgresql://jobapp.cz68q2s6o70l.ap-south-1.rds.amazonaws.com:5432/postgres?sslmode=verify-full&sslrootcert=./global-bundle.pem
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:learnAWS7004}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ===============================
# Logging (Production - Less verbose)
# ===============================
logging.level.root=INFO
logging.level.com.project=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=INFO

# ===============================
# Security / Misc
# ===============================
spring.main.allow-bean-definition-overriding=true

# ===============================
# JWT (Use environment variables in production)
# ===============================
jwt.secret=${JWT_SECRET:MySuperStrongSecretKeyForJWT1234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}
