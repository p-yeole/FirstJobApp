name: Spring boot build and deploy
on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: first-job-app

jobs:
  # name of job. There can be multiple jobs.
  build_deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the source branch
      - name: Checkout source
        uses: actions/checkout@v4

      # Java setup
      - name:  Setting up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Project build
      - name: Build Jar
        run: mvn clean package -DskipTests

      # Docker Image create
      - name: Build Docker Image
        #run: docker build -t pratikyeole/spring boot-app:latest .
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST}}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          scripts: | 
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker stop spring-boot-app || true
            docker rm spring-boot-app || true
            docker run -d --name spring-boot-app --restart unless-stopped -p 8081:8081 ${{ secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
#            prune remove unused images.